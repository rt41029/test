name: meetings

on:
  schedule:
    # Cron — UTC. Киев: лето UTC+3, зима UTC+2 (переход 25.10.2026).
    # Бот сам встаёт в очередь за 5 минут до пары; cron дёргает его за ~10 минут.
    # --- ЛЕТО (UTC+3), активно до 25.10.2026 ---
    - cron: "50 4 * * 1-5"
    - cron: "25 6 * * 1-5"
    - cron: "15 8 * * 1-5"
    - cron: "50 9 * * 1-5"
    # --- ЗИМА (UTC+2), раскомментировать с 25.10.2026 ---
    # - cron: "50 5 * * 1-5"
    # - cron: "25 7 * * 1-5"
    # - cron: "15 9 * * 1-5"
    # - cron: "50 10 * * 1-5"
  workflow_dispatch:
    inputs:
      test_url:
        description: "Проверка: ссылка Meet, зайдёт на 5 мин"
        required: false
        default: ""
      test_index:
        description: "Проверка: индекс пары из schedule.json, зайдёт на 3 мин"
        required: false
        default: ""
      force_index:
        description: "Принудительно: индекс пары — зайти сразу и сидеть до конца"
        required: false
        default: ""
      force_url:
        description: "Принудительно: ссылка Meet — зайти сразу на 90 мин"
        required: false
        default: ""

concurrency:
  group: meetings
  cancel-in-progress: false

jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install deps
        run: pip install selenium requests

      - name: Run bot
        env:
          GOOGLE_COOKIES:     ${{ secrets.GOOGLE_COOKIES }}
          GOOGLE_EMAIL:       ${{ secrets.GOOGLE_EMAIL }}
          GOOGLE_PASSWORD:    ${{ secrets.GOOGLE_PASSWORD }}
          SCHEDULE_JSON:      ${{ secrets.SCHEDULE_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_INDEX:  ${{ github.event.inputs.test_index }}
          TEST_URL:    ${{ github.event.inputs.test_url }}
          FORCE_INDEX: ${{ github.event.inputs.force_index }}
          FORCE_URL:   ${{ github.event.inputs.force_url }}
        run: python bot.py
