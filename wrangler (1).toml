name = "meet-menu-bot"
main = "worker.js"
compatibility_date = "2024-06-01"

# Тоглы пар (enabled/disabled) — создать: npx wrangler kv:namespace create SCHEDULE_KV
# и подставить id ниже, либо привязать в Dashboard: Workers -> Settings -> Bindings
kv_namespaces = [
  { binding = "SCHEDULE_KV", id = "ЗАМЕНИ_НА_ID_НЕЙМСПЕЙСА" }
]

# Авто-запуск пар по Киевскому времени (окно за 8..6 минут до начала).
# Если cron воркера включён — блок schedule: в meetings.yml можно закомментировать.
[triggers]
crons = ["* * * * *"]

# Secrets (НЕ хранить в git!): npx wrangler secret put MENU_BOT_TOKEN и т.д.
#   MENU_BOT_TOKEN, ALLOWED_CHAT_ID, WEBHOOK_SECRET, GH_TOKEN, GH_REPO,
#   SCHEDULE_JSON, GH_REF, GH_WORKFLOW
